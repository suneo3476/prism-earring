<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="prismFgTitle prismFgDesc">
<title id="prismFgTitle">prism earring</title>
<desc id="prismFgDesc">背景のない前景層。金の耳飾り金具から吊るされた横向きのカツオ。左から入った白い光が口に入り、腹側に縞のある紡錘形の体内を細い六色の筋となって進み、三日月形の尾びれの割れ目を抜けて右へ赤・橙・黄・緑・青・紫が扇状に広がる。Android アダプティブアイコンの前景層として、図柄は中央 66% の安全円内に収めてある。</desc>

<defs>
  <!-- 以下すべて魚体グループのローカル座標(logo.svg と同一の作図) -->
  <linearGradient id="metal" x1="0" y1="36" x2="0" y2="126" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff3d2"/>
    <stop offset="0.45" stop-color="#e8c877"/>
    <stop offset="1" stop-color="#a8822f"/>
  </linearGradient>

  <linearGradient id="scale" x1="0" y1="112" x2="0" y2="194" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4c6784"/>
    <stop offset="0.34" stop-color="#26374a"/>
    <stop offset="0.64" stop-color="#121b25"/>
    <stop offset="0.88" stop-color="#1b2836"/>
    <stop offset="1" stop-color="#374c62"/>
  </linearGradient>

  <linearGradient id="fin" x1="0" y1="86" x2="0" y2="210" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#33485f"/>
    <stop offset="1" stop-color="#0b1219"/>
  </linearGradient>

  <linearGradient id="edge" x1="0" y1="100" x2="0" y2="200" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.46"/>
  </linearGradient>

  <!-- 入射光。安全円に収めるため左端を x=165 で切る -->
  <linearGradient id="beam" x1="165" y1="147" x2="198" y2="152" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
    <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
  </linearGradient>

  <linearGradient id="core" x1="198" y1="152" x2="342" y2="153.3" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
  </linearGradient>

  <!-- 扇は x=445 で切るため、右端を強めに減衰させて切り口を消す -->
  <linearGradient id="fade" x1="342" y1="0" x2="445" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.40" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.80"/>
    <stop offset="0.90" stop-color="#ffffff" stop-opacity="0.40"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <mask id="fanFade" maskUnits="userSpaceOnUse" x="340" y="132" width="112" height="68">
    <rect x="340" y="132" width="112" height="68" fill="url(#fade)"/>
  </mask>

  <radialGradient id="bloom" cx="198" cy="152" r="26" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <clipPath id="bodyClip">
    <path d="M198 152 C216 130 240 118 266 116 C298 115 324 130 342 147 L342 158 C324 176 298 191 266 191 C238 190 212 172 198 152 Z"/>
  </clipPath>
</defs>

<!-- 前景層のため背景は描かない。黒の背景層と重ねて使う -->

<!-- 図柄は Android アダプティブアイコンの安全円(直径 66%、半径 156.4)に収める。
     ローカル中心 (300,125) を画面中心へ、倍率 0.96。最遠点の半径は約 154 -->
<g transform="translate(256,256) scale(0.96) translate(-300,-125)">

  <!-- 入射光(白) -->
  <polygon points="165,146.17 198,149.8 198,154.2 165,151.83" fill="url(#beam)"/>

  <!-- 尾から右へ広がるスペクトル。x=445 で減衰しきる -->
  <g mask="url(#fanFade)">
    <polygon points="342,148.2 342,149.9 445,147.17 445,137.76" fill="#ff3b45"/>
    <polygon points="342,149.9 342,151.6 445,156.58 445,147.17" fill="#ff9124"/>
    <polygon points="342,151.6 342,153.3 445,165.98 445,156.58" fill="#ffdb2e"/>
    <polygon points="342,153.3 342,155.0 445,175.39 445,165.98" fill="#3fd25e"/>
    <polygon points="342,155.0 342,156.7 445,184.80 445,175.39" fill="#3c8dff"/>
    <polygon points="342,156.7 342,158.4 445,194.20 445,184.80" fill="#a663ff"/>
  </g>

  <!-- 耳金具:フックと丸カン -->
  <g fill="none" stroke="url(#metal)" stroke-width="4.0" stroke-linecap="round">
    <path d="M302 99 L302 62 C302 38 276 38 276 62 L276 76"/>
    <circle cx="302" cy="105" r="6"/>
    <path d="M302 111 L302 123"/>
  </g>

  <!-- ひれ・小離鰭 -->
  <g fill="url(#fin)" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.3" stroke-linejoin="round">
    <path d="M250 119 C259 101 271 92 288 90 C284 103 282 113 281 122 Z"/>
    <path d="M283 188 C290 200 296 206 303 208 C296 202 291 195 289 187 Z"/>
    <path d="M244 186 C250 195 254 200 258 203 C252 198 248 192 246 185 Z"/>
    <path d="M312 127 L321 120 L319 131 Z"/>
    <path d="M323 134 L332 128 L330 139 Z"/>
    <path d="M311 178 L320 185 L318 174 Z"/>
    <path d="M322 171 L331 177 L329 166 Z"/>
  </g>

  <!-- 尾びれ(三日月形)。スペクトルの手前 -->
  <path d="M342 146 C358 134 374 114 388 94 C387 129 376 147 348 152.5 C376 158 387 176 388 211 C374 191 358 171 342 159 Z"
        fill="url(#fin)" stroke="url(#edge)" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- 体(紡錘形) -->
  <path d="M198 152 C216 130 240 118 266 116 C298 115 324 130 342 147 L342 158 C324 176 298 191 266 191 C238 190 212 172 198 152 Z"
        fill="url(#scale)"/>

  <g clip-path="url(#bodyClip)">
    <path d="M238 124 C232 142 233 160 241 177" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.7"/>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.2" stroke-linecap="round">
      <path d="M224 168 C256 174 292 173 330 166"/>
      <path d="M226 175 C258 181 294 180 332 172"/>
      <path d="M232 182 C262 188 296 186 330 178"/>
      <path d="M242 188 C268 193 296 191 324 184"/>
    </g>

    <!-- 体内:六色が細く収束したまま尾へ進む -->
    <polygon points="198,149.8 198,150.5 342,149.9 342,148.2" fill="#ff3b45"/>
    <polygon points="198,150.5 198,151.3 342,151.6 342,149.9" fill="#ff9124"/>
    <polygon points="198,151.3 198,152.0 342,153.3 342,151.6" fill="#ffdb2e"/>
    <polygon points="198,152.0 198,152.7 342,155.0 342,153.3" fill="#3fd25e"/>
    <polygon points="198,152.7 198,153.5 342,156.7 342,155.0" fill="#3c8dff"/>
    <polygon points="198,153.5 198,154.2 342,158.4 342,156.7" fill="#a663ff"/>
    <polygon points="198,149.8 198,154.2 342,158.4 342,148.2" fill="url(#core)"/>
  </g>

  <!-- 体の稜線 -->
  <path d="M198 152 C216 130 240 118 266 116 C298 115 324 130 342 147 L342 158 C324 176 298 191 266 191 C238 190 212 172 198 152 Z"
        fill="none" stroke="url(#edge)" stroke-width="3.0" stroke-linejoin="round"/>

  <!-- 胸びれ・口・目 -->
  <path d="M240 160 C254 166 268 175 280 187 C264 183 250 176 240 166 Z"
        fill="#0d151d" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M200 154 C207 158 213 160 219 161" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="224" cy="142" r="4.8" fill="#070b0f" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.6"/>
  <circle cx="222.4" cy="140.4" r="1.3" fill="#ffffff" fill-opacity="0.85"/>

  <circle cx="198" cy="152" r="26" fill="url(#bloom)"/>
</g>
</svg>
